services:

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    volumes:
      - chromadb_data:/chroma/chroma
    ports:
      - "8000:8000"
    restart: unless-stopped

  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:latest
    container_name: docling-service
    environment:
      # VLM remoto via OpenRouter (substitui o token do Hugging Face)
      - DOCLING_SERVE_ENABLE_REMOTE_SERVICES=true
      - DOCLING_SERVE_DEFAULT_VLM_PRESET=openrouter
      - 'DOCLING_SERVE_CUSTOM_VLM_PRESETS={"openrouter": {"model_spec": {"name": "OpenRouter Gemini 2.5 Flash", "default_repo_id": "google/gemini-2.5-flash", "prompt": "Convert this page to markdown. Do not miss any text and only output the bare markdown!", "response_format": "markdown"}, "engine_options": {"engine_type": "api", "url": "https://openrouter.ai/api/v1/chat/completions", "headers": {"Authorization": "Bearer ${OPENROUTER_API_KEY}"}, "params": {"model": "google/gemini-2.5-flash", "max_tokens": 8192}, "timeout": 120.0, "concurrency": 4}, "scale": 2.0}}'
      - DOCLING_MAX_WORKERS=8
    volumes:
      - docling_cache:/root/.cache/huggingface
    ports:
      - "5001:5001"
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    depends_on:
      - chromadb
      - docling
    ports:
      - "3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:

      # Ollama bare metal
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_KEEP_ALIVE=24h

      # Base vetorial
      - VECTOR_DB=chroma
      - CHROMA_HTTP_HOST=chromadb
      - CHROMA_HTTP_PORT=8000

      # Embeddings Ollama
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=qwen3-embedding:0.6b
      - RAG_EMBEDDING_BATCH_SIZE=32

      # Timeout ampliado
      - WEBUI_TIMEOUT=300

    restart: unless-stopped

volumes:

  chromadb_data:
    name: chromadb_data

  docling_cache:
    name: docling_cache

  open_webui_data:
    name: open_webui_data
